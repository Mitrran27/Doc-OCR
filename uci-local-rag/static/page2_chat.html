    <div class="top-bar">

<script>

        chatWindow.scrollTop = chatWindow.scrollHeight;

                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: question, doc_id: docId }),

                const errText = await res.text();
                throw new Error(errText || `Request failed (${res.status})`);

    function updateUrl() {

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UCI — Chat</title>
<link rel="stylesheet" href="/static/style.css">
<style>
    .frame { max-width: 760px; }
    .top-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 2px; }
    .back { font-family: var(--mono); font-size: 0.78rem; color: var(--text-muted); text-decoration: none; }
    .back:hover { color: var(--amber); }
    .doc-name { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }

    #log { flex: 1; overflow-y: auto; padding: 18px 2px; display: flex; flex-direction: column; gap: 20px; }

    .entry-user {
        font-size: 0.95rem;
        color: var(--text-muted);
        padding-left: 14px;
        border-left: 2px solid var(--hairline);
    }
    .entry-assistant {
        background: var(--panel);
        border: 1px solid var(--hairline);
        border-left: 3px solid var(--amber);
        border-radius: 6px;
        padding: 16px 18px;
        font-size: 0.95rem;
        line-height: 1.55;
        white-space: pre-wrap;
    }
    .citations { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hairline); }
    .citations-label { font-family: var(--mono); font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px; }

    .figures { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hairline); display: flex; flex-wrap: wrap; gap: 12px; }
    .figure-item { margin: 0; max-width: 220px; }
    .figure-item img { width: 100%; border-radius: 4px; border: 1px solid var(--hairline); display: block; }
    .figure-item figcaption { font-family: var(--mono); font-size: 0.68rem; color: var(--text-muted); margin-top: 5px; }

    .thinking { font-family: var(--mono); font-size: 0.8rem; color: var(--text-muted); font-style: italic; }
    .history-loading { font-family: var(--mono); font-size: 0.8rem; color: var(--text-muted); font-style: italic; text-align: center; padding: 10px 0; }

    #input-row { display: flex; gap: 8px; padding-top: 14px; border-top: 1px solid var(--hairline); }
    #question { flex: 1; resize: none; }
</style>
</head>
<body>
<div class="frame">
    <div class="top-row">
        <a class="back" href="/">&larr; Index</a>
    </div>
    <div class="wordmark" style="margin-top:2px;">
        <span class="mark">UCI</span>
        <span class="doc-name" id="doc-title">\u2014</span>
    </div>
    <div class="rule"></div>

    <div id="log"></div>

    <div id="input-row">
        <textarea id="question" rows="1" placeholder="Ask about this document\u2026"></textarea>
        <button id="send-btn">Ask</button>
    </div>
    <div class="disclaimer">VERIFY EVERY CITATION AGAINST THE OFFICIAL STANDARD BEFORE COMPLIANCE SIGN-OFF</div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const docId = params.get("doc_id");
    const docName = params.get("name") || "No document selected";
    document.getElementById("doc-title").textContent = decodeURIComponent(docName);

    const log = document.getElementById("log");
    const questionBox = document.getElementById("question");
    const sendBtn = document.getElementById("send-btn");

    if (!docId) {
        addAssistant("No document selected \u2014 go back to the index and open one.", [], []);
        sendBtn.disabled = true;
    }

    function addUser(text) {
        const div = document.createElement("div");
        div.className = "entry-user";
        div.textContent = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    function addAssistant(text, sources, images) {
        const wrap = document.createElement("div");
        wrap.className = "entry-assistant";
        wrap.textContent = text;

        if (sources && sources.length) {
            const seen = new Set();
            const plates = [];
            for (const s of sources) {
                const key = `${s.clause}-${s.pages}`;
                if (seen.has(key)) continue;
                seen.add(key);
                plates.push(`<span class="citation-plate">CL ${s.clause} \u00b7 P${s.pages}</span>`);
            }
            if (plates.length) {
                const box = document.createElement("div");
                box.className = "citations";
                box.innerHTML = `<div class="citations-label">Cited from</div>${plates.join("")}`;
                wrap.appendChild(box);
            }
        }

        // Figures relevant to the retrieved context — shown automatically
        // whenever the answer drew from a clause that has an associated
        // image, rather than trying to guess "did the user ask for an image".
        if (images && images.length) {
            const figBox = document.createElement("div");
            figBox.className = "figures";
            figBox.innerHTML = `<div class="citations-label">Figures</div>`;
            for (const img of images) {
                const fig = document.createElement("figure");
                fig.className = "figure-item";
                fig.innerHTML = `
                    <img src="${img.url}" alt="${img.caption}" loading="lazy">
                    <figcaption>${img.caption}</figcaption>
                `;
                figBox.appendChild(fig);
            }
            wrap.appendChild(figBox);
        }

        log.appendChild(wrap);
        log.scrollTop = log.scrollHeight;
        return wrap;
    }

    // Restore prior conversation for this doc_id, if any exists — this is
    // what makes "Open" on page1 land back on an already-populated chat
    // instead of a blank window. No separate "load history" button; it just
    // happens automatically whenever a doc_id is present in the URL.
    async function loadHistory() {
        if (!docId) return;

        const loadingMsg = document.createElement("div");
        loadingMsg.className = "history-loading";
        loadingMsg.textContent = "Loading previous conversation\u2026";
        log.appendChild(loadingMsg);

        try {
            const res = await fetch(`/chat/history?doc_id=${encodeURIComponent(docId)}`);
            loadingMsg.remove();
            if (!res.ok) return; // unknown doc_id, or no history yet — just start fresh

            const history = await res.json();
            for (const msg of history) {
                if (msg.role === "user") {
                    addUser(msg.text);
                } else {
                    addAssistant(msg.text, msg.sources, msg.images);
                }
            }
        } catch (err) {
            loadingMsg.remove();
            // Silent fail — worst case the user just starts a fresh-looking
            // conversation instead of seeing an error before they've typed anything.
        }
    }

    async function sendQuestion() {
        const question = questionBox.value.trim();
        if (!question || !docId) return;

        addUser(question);
        questionBox.value = "";
        sendBtn.disabled = true;

        const thinking = document.createElement("div");
        thinking.className = "thinking";
        thinking.textContent = "UCI is searching the standard\u2026";
        log.appendChild(thinking);
        log.scrollTop = log.scrollHeight;

        try {
            const res = await fetch("/chat/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: question, doc_id: docId }),
            });
            if (!res.ok) throw new Error(await res.text());
            const data = await res.json();
            thinking.remove();
            addAssistant(data.answer, data.sources, data.images);
        } catch (err) {
            thinking.remove();
            addAssistant(`Error: ${err.message}`, [], []);
        } finally {
            sendBtn.disabled = false;
        }
    }

    sendBtn.addEventListener("click", sendQuestion);
    questionBox.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendQuestion();
        }
    });

    loadHistory();
</script>
</body>
</html>
